name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time placeholder only. CI does not connect to this database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/commutemap_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Test environment validation
        run: pnpm test:env

      - name: Test journey calculations
        run: pnpm test:journey-estimates

      - name: Build production application
        run: pnpm build
