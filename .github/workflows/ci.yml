name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time placeholder only. CI does not connect to this database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/commutemap_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Test environment validation
        run: pnpm test:env

      - name: Test journey calculations
        run: pnpm test:journey-estimates

      - name: Build production application
        run: pnpm build

  container:
    name: Production container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: commutemap-ph:ci

  integration:
    name: PostGIS integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://commutemap:commutemap_ci@127.0.0.1:5432/commutemap_ci
      APP_URL: http://127.0.0.1:3000

    services:
      database:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: commutemap_ci
          POSTGRES_USER: commutemap
          POSTGRES_PASSWORD: commutemap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commutemap -d commutemap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed public locations
        run: pnpm db:seed

      - name: Seed provisional route
        run: pnpm db:seed-draft-routes

      - name: Seed provisional journey
        run: pnpm db:seed-draft-journey

      - name: Validate provisional journey structure
        run: pnpm db:check-draft-journey

      - name: Confirm provisional journey remains blocked
        run: |
          set +e
          readiness_output="$(pnpm db:check-journey-readiness one-ayala-to-bgc-high-street-via-bgc-bus 2>&1)"
          readiness_status=$?
          set -e

          echo "$readiness_output"

          if [ "$readiness_status" -eq 0 ]; then
            echo "Expected the provisional journey readiness check to fail."
            exit 1
          fi

          case "$readiness_output" in
            *"Not ready to publish"*)
              echo "Provisional journey is correctly blocked."
              ;;
            *)
              echo "Readiness command failed for an unexpected reason."
              exit 1
              ;;
          esac

      - name: Build production application
        run: pnpm build

      - name: Start production application
        run: |
          pnpm start > "$RUNNER_TEMP/commutemap-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/commutemap-server.pid"

      - name: Wait for application health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "$APP_URL/api/health" > /dev/null; then
              echo "Application is healthy."
              exit 0
            fi

            sleep 1
          done

          echo "Application did not become healthy."
          cat "$RUNNER_TEMP/commutemap-server.log"
          exit 1

      - name: Run public release smoke checks
        run: pnpm check:public-release

      - name: Show application logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/commutemap-server.log" ]; then
            cat "$RUNNER_TEMP/commutemap-server.log"
          else
            echo "Application server was not started."
          fi

      - name: Stop production application
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/commutemap-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/commutemap-server.pid")" || true
          fi
